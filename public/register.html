<!DOCTYPE html>
<html lang="en">
<head>
    <title>Moneyfy - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <h2 class="logo">
    <span class="logo-icon">💰</span> Moneyfy
</h2>


    
</div>

<!-- Main container -->
<div class="container">

    <!-- Left text section -->
    <div class="left">
        <h1>Take control of<br>your finances</h1>
        <p>
            Create your account to track expenses, save money,
            and achieve your financial goals with ease.
        </p>
    </div>

    <!-- Registration form -->
    <div class="right">
        <h2>Create Account</h2>

       <form action="/register" method="POST">

            <input class="field" type="text" name="name" placeholder="Full Name" required>
<input class="field" type="email" name="email" placeholder="Email Address" required>
<input class="field" type="password" name="password" placeholder="Password" required>


            <button type="submit">Register</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

</div>

</body>
</html>
