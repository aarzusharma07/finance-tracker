<!DOCTYPE html>
<html>
<head>
    <title>Transactions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <h2 class="logo">💰 Moneyfy</h2>
</div>

<!-- Tabs -->
<div class="tabs">
    <span onclick="loadData('daily', this)">Daily</span>
    <span onclick="loadData('weekly', this)">Weekly</span>
    <span class="active" onclick="loadData('monthly', this)">Monthly</span>
</div>


<!-- Summary -->
<div class="summary">
    <div>
        <p>Income</p>
        <h3 id="income">₹0</h3>
    </div>
    <div>
        <p>Expenses</p>
        <h3 id="expense">₹0</h3>
    </div>
    <div>
        <p>Total</p>
        <h3 id="total">₹0</h3>
    </div>
</div>

<!-- Transactions -->
<div id="transactionList"></div>

<script>
function loadData(type, tab) {

    // active tab UI
    document.querySelectorAll(".tabs span").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");

    fetch(`/transactions/${type}`)
    .then(res => res.json())
    .then(data => {

        document.getElementById("income").innerText = "₹" + data.income;
        document.getElementById("expense").innerText = "₹" + data.expense;
        document.getElementById("total").innerText = "₹" + data.total;

        const container = document.getElementById("transactionList");
        container.innerHTML = "";

        const grouped = {};

        data.transactions.forEach(t => {
            const key = new Date(t.date).toDateString();
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(t);
        });

        Object.keys(grouped).forEach(date => {
            const dateHeader = document.createElement("div");
            dateHeader.className = "date-group";
            dateHeader.innerText = date;
            container.appendChild(dateHeader);

            grouped[date].forEach(t => {
                const row = document.createElement("div");
                row.className = "transaction-item";
                row.innerHTML = `
                    <span>${t.title}</span>
                    <span style="color:${t.type === "income" ? "green" : "red"}">
                        ₹${t.amount}
                    </span>
                `;
                container.appendChild(row);
            });
        });
    });
}

// load monthly by default
loadData("monthly", document.querySelector(".tabs span"));
</script>

</body>
</html>
